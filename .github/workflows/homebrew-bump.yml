# Reusable workflow: Homebrew tap formula bump
#
# Single source of truth for "tag a release in a tool repo → bump the
# corresponding homebrew-<tool> Formula's url + sha256." Called from each
# tool's own .github/workflows/release.yml as:
#
#   jobs:
#     bump-tap:
#       uses: autumngarage/autumn-garage/.github/workflows/homebrew-bump.yml@v1
#       with:
#         formula-name: <tool-name>
#         tap-repo: autumngarage/homebrew-<tool-name>
#         tag-name: ${{ inputs.tag_name || github.event.release.tag_name }}
#       secrets:
#         HOMEBREW_TAP_PAT: ${{ secrets.HOMEBREW_TAP_PAT }}
#
# The caller is responsible for the trigger event (release.published is
# the recommended default) and any prerelease gating — this workflow
# stays narrow and only does the bump.
#
# Versioning: tag this repo `v1` for the current contract. Breaking
# input/secret changes bump to `v2`; non-breaking changes update `v1`
# in place (consumers pinning `@v1` track the floating major).
#
# History:
#   v1.0  Wrapped mislav/bump-homebrew-formula-action@v4.1.
#   v1.1  Inline curl + gh api. The mislav action hard-codes a
#         `res.statusCode == 302` check against GitHub's tarball
#         redirect; GitHub now returns HTTP 303 for codeload from
#         Actions runners, so the action errors with "unexpected HTTP
#         303 response" before writing the formula. Conductor v0.10.27
#         (2026-05-16) was the first release blocked by this; the same
#         failure mode would have hit touchstone / sentinel / cortex
#         on their next release. The inline path needs no third-party
#         action and is the same logic the operator runs by hand when
#         the workflow stalls.

name: Homebrew tap formula bump (reusable)

on:
  workflow_call:
    inputs:
      formula-name:
        description: "Formula name without .rb, e.g. 'conductor'"
        required: true
        type: string
      tap-repo:
        description: "Tap repo slug, e.g. 'autumngarage/homebrew-conductor'"
        required: true
        type: string
      tag-name:
        description: "Tag to bump the formula to, e.g. 'v0.3.4'"
        required: true
        type: string
      formula-path:
        description: "Override the formula path (default: Formula/<formula-name>.rb)"
        required: false
        type: string
        default: ""
    secrets:
      HOMEBREW_TAP_PAT:
        description: "PAT with `repo` scope on the tap repo (commits the bump)"
        required: true

jobs:
  bump-tap:
    runs-on: ubuntu-latest
    env:
      FORMULA_NAME: ${{ inputs.formula-name }}
      TAP_REPO: ${{ inputs.tap-repo }}
      TAG_NAME: ${{ inputs.tag-name }}
      FORMULA_PATH: ${{ inputs.formula-path != '' && inputs.formula-path || format('Formula/{0}.rb', inputs.formula-name) }}
      SOURCE_REPO: ${{ github.repository }}
      SOURCE_SHA: ${{ github.sha }}
      GH_TOKEN: ${{ secrets.HOMEBREW_TAP_PAT }}
    steps:
      - name: Bump tap formula (curl + gh api)
        shell: bash
        run: |
          set -euo pipefail

          version="${TAG_NAME#v}"
          tarball_url="https://github.com/${SOURCE_REPO}/archive/refs/tags/${TAG_NAME}.tar.gz"

          echo "::group::Download tarball and compute SHA256"
          curl -fL --retry 3 --retry-delay 2 "$tarball_url" -o /tmp/source.tar.gz
          sha256="$(sha256sum /tmp/source.tar.gz | awk '{print $1}')"
          echo "version=${version}  sha256=${sha256}"
          echo "::endgroup::"

          echo "::group::Fetch current formula"
          gh api "repos/${TAP_REPO}/contents/${FORMULA_PATH}" >/tmp/formula-meta.json
          jq -r '.content' /tmp/formula-meta.json | base64 -d >/tmp/formula.rb
          existing_sha="$(jq -r '.sha' /tmp/formula-meta.json)"
          echo "existing blob sha: ${existing_sha}"
          echo "::endgroup::"

          echo "::group::Rewrite url + sha256 lines"
          # `sed -E` with anchors so a stray `url`/`sha256` substring in
          # the caveats block can't be hit. POSIX `[[:space:]]` instead
          # of `\s` so the same script runs on BSD sed locally and GNU
          # sed in the runner.
          new_url="https://github.com/${SOURCE_REPO}/archive/refs/tags/${TAG_NAME}.tar.gz"
          sed -E -i \
            -e "s|^([[:space:]]*url )\"[^\"]+\"|\1\"${new_url}\"|" \
            -e "s|^([[:space:]]*sha256 )\"[0-9a-f]{64}\"|\1\"${sha256}\"|" \
            /tmp/formula.rb

          if ! grep -q "\"${new_url}\"" /tmp/formula.rb; then
            echo "::error::sed did not rewrite the url line; formula left unchanged"
            head -10 /tmp/formula.rb
            exit 1
          fi
          if ! grep -q "\"${sha256}\"" /tmp/formula.rb; then
            echo "::error::sed did not rewrite the sha256 line; formula left unchanged"
            head -10 /tmp/formula.rb
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::PUT new formula content"
          new_content_b64="$(base64 -w0 </tmp/formula.rb)"
          commit_message="${FORMULA_NAME} ${version}

          Released by GitHub Actions from ${SOURCE_REPO}@${SOURCE_SHA}."
          gh api -X PUT "repos/${TAP_REPO}/contents/${FORMULA_PATH}" \
            -f message="$commit_message" \
            -f content="$new_content_b64" \
            -f sha="$existing_sha" \
            --jq '"committed " + .commit.sha + " — " + .commit.message'
          echo "::endgroup::"
